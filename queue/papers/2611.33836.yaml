  title: Can Its Own Misses Teach an MLLM to Find Small Brain Metastases?
  authors:
  - Yixuan Duan
  - Kexin Geng
  - Hanwen Xu
  - Wei Qiu
  published: '2026-11-25'
  updated: '2026-11-25'
  categories:
  - cs.AI
  abstract: 'Multimodal large language models (MLLMs) are becoming general readers of medical images,
    yet they remain weak at locating small abnormalities. Brain metastases expose this gap: at 384 px
    a 0.1 mL lesion covers less than a quarter of one visual token, and at one false positive per scan
    frontier MLLMs find fewer than 30% of lesions of 0.1-1 mL. Fine-tuning on one dataset helps but transfers
    poorly, and improving it further is slow trial and error steered by a single score. We introduce LANTERN
    (Lesion-finding AgeNt Through Error-driven Recursive learNing), a framework in which an MLLM improves
    recursively from its own misses. LANTERN recasts model development as an error-driven loop: a failure
    census attributes every missed lesion to one of four causes, an LLM mentor revises one of four levels
    (evidence acquisition, visual representation, learning policy, decision aggregation) per round, and
    a rule frozen before the first round decides what is kept, without test data and with every tool call
    audited. Over 15 unattended rounds, LANTERN raises a fine-tuned 4B MLLM from finding 75% to 94% of
    lesions at one false positive per scan on BraTS-MET, and 91% of those of 0.1-1 mL, compared with at
    most 51% and 29% for five frontier MLLMs read under the starting protocol; the gains hold on an external
    cohort (89%) and on unseen meningiomas (77%). These results show that an MLLM''s own misses, attributed
    to their causes, can drive its reliable recursive self-improvement.'
