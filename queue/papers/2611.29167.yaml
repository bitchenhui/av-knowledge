  abstract: 'Chest CT reports repeatedly assess the same anatomical regions for findings and their attributes,
    such as whether a lung nodule is present and where it is located. These assessments suggest learning
    to answer visual questions directly, rather than coupling perception to open-ended text generation.
    Yet current CT report generation models largely follow generic vision-language modeling, which may
    miss subtle abnormalities when training data are limited. We therefore formulate report generation
    as a set of visual question-answering decisions coordinated by a large language model (LLM) agent.
    This decouples visual perception from reasoning and report writing: perception can be learned as a
    discriminative, non-generative task, while the LLM focuses on reasoning over patient context and posing
    relevant visual queries. We introduce Rad-VL-JEPA, which unifies report retrieval, finding recognition,
    and fine-grained attribute characterization through vision-language joint-embedding prediction. Building
    on this perception module, an agent trained with reinforcement learning (RL) acquires patient-specific
    visual evidence, while a separate editor incorporates the evidence into the final report, further
    separating evidence acquisition from report realization. Experiments show that Rad-VL-JEPA achieves
    strong performance on fine-grained CT understanding tasks with lower amortized per-query inference
    time than a generative VLM baseline trained with the same CT encoder and VQA data. The resulting reporting
    system outperforms strong VLM-based and agentic baselines.'
