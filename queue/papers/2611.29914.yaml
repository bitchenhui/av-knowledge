  abstract: Image Coding for Machines (ICM) aims to preserve task-relevant information for machine vision
    under limited bitrates. However, most ICM models are trained for a fixed operating point, and extending
    them to variable-rate compression is challenging because their training objectives differ across tasks
    and model designs. In this paper, we propose a loss-agnostic distillation framework for variable-rate
    ICM. A pretrained fixed-rate ICM model is used as a frozen teacher, while a student model learns variable-rate
    behavior through importance-adaptive quantization and distillation-based optimization. This enables
    continuous bitrate control with a single model while preserving task-relevant latent components, without
    requiring the original task-specific loss or downstream task labels. Experiments based on existing
    ICM models demonstrate that the proposed method provides continuous bitrate control and achieves competitive
    recognition performance compared with the fixed-rate models.
