  title: Rate-Quality-Energy Convex Hull for High Dynamic Range Adaptive Video Streaming
  authors:
  - Amritha Premkumar
  - Christian Herglotz
  published: '2026-11-21'
  updated: '2026-11-21'
  categories:
  - eess.IV
  - cs.MM
  abstract: High Dynamic Range (HDR) video introduces substantially higher decoding complexity and energy
    consumption than Standard Dynamic Range (SDR), yet most adaptive streaming pipelines still rely on
    bitrate ladders optimized using SDR-oriented metrics such as VMAF. These ladders fail to capture HDR-specific
    perceptual behavior and ignore decoder-side energy, resulting in energetically inefficient operating
    points. This work proposes a rate-quality-energy convex-hull optimization framework that jointly considers
    bitrate, HDR-aware perceptual quality (HDRVMAF), and client-side processing energy, including decoding
    and upscaling. Experiments on twelve 4K HDR sequences from the LIVE HDR Video Quality Assessment Database
    evaluate 72 representations per clip and demonstrate that traditional VMAF-optimized ladders frequently
    select high-resolution encodes that become dominated once energy is accounted for. Compared to the
    Default HLS ladder, our HDR-aware method achieves substantial bitrate savings of up to 54.34% at equal
    HDRVMAF, while yielding relative client-side energy reductions of up to 43.10% under higher energy
    weighting. These results demonstrate the effectiveness of the proposed framework as a practical foundation
    for constructing HDR bitrate ladders that explicitly expose and control perceptual quality-energy
    trade-offs.
