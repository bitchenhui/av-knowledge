  abstract: Live free-viewpoint video streaming of humans enables immersive telepresence and interactive
    XR applications. However, this requires reconstructing each frame in real time, transmitting the data
    within strict bandwidth budgets, and decoding it on lightweight client GPUs. Existing approaches,
    whether relying on per-frame optimization or feed-forward inference, generate massive 3D Gaussian
    payloads that exceed practical streaming limits, while aggressive compression severely degrades rendering
    quality. In this work, we present HoloSplat, a real-time streaming framework for human-centric volumetric
    video. HoloSplat splits a feed-forward reconstructor before its Gaussian head, introducing a multi-rate
    streaming codec driven by server-side token compression and client-side token restoration. On the
    server side, we apply opacity-guided token pruning, PCA-based dimensionality reduction, and lossless
    geometry coding for token anchors. On the client side, a feature reconstruction hypernetwork is fused
    into the Gaussian head to recover compression-induced quality loss. Furthermore, we introduce Neural
    Session Calibration (NSC), which rapidly fine-tunes the Gaussian head online using incoming camera
    views during a warm-up phase. This resolves quality degradation from novel camera parameters and varying
    capture conditions with zero per-frame overhead. In our evaluations, HoloSplat averages 32.2 FPS on
    four RTX 5090 GPUs at 50 Mbit/s. It decodes each frame into 3D Gaussians in 22.1 ms on an RTX 3050
    Ti laptop GPU, transmitting 22.8$\times$ less data than uncompressed float32 Gaussians, while calibrated
    decoding improves PSNR by 1.050 dB.
