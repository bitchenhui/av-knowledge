  abstract: 'Existing adversarial attacks on vision-language models (VLMs) and cross-spectral perception
    primarily rely on conspicuous, unnatural artifacts, such as vivid adversarial patches or active light
    beams, that lack physical stealthiness, whereas prior weather attacks largely overlook how one atmosphere
    simultaneously affects heterogeneous sensors. This raises a key scientific question: can a purely
    natural, shared fog environment simultaneously disrupt complementary visible and thermal infrared
    cues without artificial surface modifications? We introduce Fog Manipulation Attack (FMA), a zero-gradient
    attack that optimizes a common 3D fog state to induce simultaneous semantic failures in visible-infrared
    VLMs. FMA links shared, depth- and layer-aware atmospheric propagation along scene paths with band-specific
    imaging physics---visible airlight scattering and thermal path radiance---allowing one realistic fog
    state to erode both modalities'' distinct cues. Experiments show that FMA more than doubles simultaneous
    failure rates over fidelity-matched random fog, transfers to captioning and VQA, and removes cross-modal
    compensation, where restoring a clean companion view recovers 64%--74% of lost dual-input VQA answers.'
