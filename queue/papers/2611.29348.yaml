  abstract: Deep learning models for nuclei detection and classification may generalize poorly across
    medical centers because of variations in staining and scanning. Although color normalization aims
    to reduce these variations, its effects on nuclear structure, background preservation, artifact sensitivity,
    and nuclei detection and classification performance have not been systematically evaluated. We present
    a procedure to benchmark 11 classical and deep learning normalization methods using 7 public and private
    nuclei datasets. Additionally, we investigate the effect of 7 input color spaces. The normalization
    methods differed in their effects on nuclear structure, background, and sensitivity to artifacts.
    However, detection and classification performance varied more across datasets than across normalization
    methods, and the input color space had limited influence. No single method performed best on all criteria,
    and image-level metrics did not reliably predict downstream performance, highlighting the need for
    nuclei- and structure-aware normalization methods. To support this work, we introduce WSI Quality
    Control and Normalization (WSI-QCN), a publicly available pipeline for robust whole-slide image quality
    assessment and color normalization; the source code is available on GitHub.
