  title: 'RVLM: Fewer Tokens, Better Resolution Scaling, Fine-Grained Spatial Grounding'
  authors:
  - Savya Khosla
  - Chris Dongjoo Kim
  - Alex Schwing
  - Derek Hoiem
  - Christopher Clark
  - Sangho Lee
  published: '2026-11-22'
  updated: '2026-11-22'
  categories:
  - cs.CV
  abstract: Vision-Language Models (VLMs) tokenize images using fixed spatial grids, so visual token count
    grows with pixel area rather than scene content. We propose to group neighboring patches based on
    their visual appearance, allowing tokens to represent coherent image regions rather than fixed spatial
    windows. We introduce RVLM, a VLM trained to use regions rather than patches as its visual units.
    Analyzing region construction for general-purpose VLMs, we find that regions must cover the full image,
    stay spatially connected during end-to-end training, and preserve fine structure such as small text,
    while semantic grouping adds little. RVLM therefore partitions images using training-free Felzenszwalb-Huttenlocher
    segmentation, assigns each ViT patch to a region, and pools patches within each region into a variable-length
    sequence of visual tokens. The patch-to-region assignment is retained to support spatially precise
    prediction through coarse-to-fine decoding. Across tasks spanning VQA, pointing, counting, segmentation,
    and depth estimation, RVLM matches or improves example-weighted task performance while using 21.5%
    fewer visual tokens than an identically trained patch baseline. The advantage grows with image resolution,
    reaching a 5.3-point gain while using 51.8% fewer visual tokens at the highest-resolution setting.
    The gains are largest on spatially demanding tasks, where prior token-reduction methods degrade most
    sharply. RVLM adds no model parameters and improves inference throughput by up to 35.9%. On unseen
    pathology and satellite images and on video benchmarks without any video training, RVLM performs on
    par with the patch baseline while using 2-3$\times$ fewer visual tokens. These results establish regions
    as a scalable alternative to patch-based visual representations while preserving the spatial precision
    required for grounded prediction.
