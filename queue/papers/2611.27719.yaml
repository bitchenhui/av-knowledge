  title: 'VeilGS: Solving Darkness as a Veil of 2D Basis Maps over Retinex 3DGS'
  authors:
  - Mohab Kishawy
  - Chengzhou Tang
  - Shahram Shirani
  - Jun Chen
  published: '2026-11-20'
  updated: '2026-11-20'
  categories:
  - cs.CV
  - cs.GR
  abstract: In a dark capture, the darkness is not uniform. How much light reaches a surface depends on
    where it lies relative to the few light sources, and the camera compresses what remains with a tone
    curve. Most low-light 3D reconstruction methods either apply one curve to every pixel of a view, so
    a dark object beside a lamp and a bright one in an unlit corner receive the same correction, or store
    the darkness in the 3D representation, where it can absorb scene detail. We present VeilGS, a 3D Gaussian
    Splatting method for low-light novel view synthesis that treats the degradation as a veil drawn over
    a clear scene. Each Gaussian carries an albedo and a shading latent instead of spherical harmonics,
    separating surface colour from illumination. Each view is darkened by a spatially varying gain followed
    by a global tone curve, and rendering without this veil gives the restored scene. A small network
    predicts a coarse basis for the gain from the observation, and its coefficients are solved for each
    view rather than learned. Training through this solve discourages the Gaussians from absorbing what
    the veil can explain. VeilGS needs no paired normal-light supervision and stores no per-view parameters.
    On Gaussian-DK, its restored renders score best on no-reference NIQE and CLIP-IQA and are rated highest
    in a blind user study with 55 participants. On LOM, it achieves results competitive with the state
    of the art.
