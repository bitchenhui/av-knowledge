  title: 'IRTIQA: Evolving in English, Evaluated in Urdu -- Does Agent Self-Evolution Transfer from English
    to Urdu and Code-Switched Input?'
  authors:
  - Abdullah Hashmat
  - Danish Javed
  - Usman Naseem
  - Agha Ali Raza
  published: '2026-11-25'
  updated: '2026-11-25'
  categories:
  - cs.CL
  abstract: 'As LLM agents increasingly learn from their own experience, the tasks they learn from and
    are evaluated on are almost always in English. We ask whether self-evolution transfers from English
    to Urdu, and release IRTIQA, a benchmark of aligned English, Urdu-translated, and Urdu code-switched
    variants of DROP, SNIPS, AppWorld, and SkillsBench, built with a matrix-language code-switching pipeline
    and human verification. Using IRTIQA, we evaluate three self-evolving frameworks, Tool-R0 (self-play
    RL), AgentEvolver (experience-guided RL), and Autogenesis (protocol-level evolution), against their
    unevolved backbones. Self-evolution often raises capability: AgentEvolver lifts AppWorld goal completion
    from near zero to 20-36% across all conditions, and Autogenesis improves SkillsBench pass rate from
    16.48% to 22.22%. But it rarely closes the language gap. Evolved systems remain stronger in English,
    by up to 0.26 DROP F1, the gap is largest on multi-step tasks, and code-switching behaves as a distinct
    condition rather than degraded translation. On a shared Gemma-4 31B backbone, the gap exists before
    evolution, and RL-based evolution can hurt Urdu reasoning more than English. Language parity must
    therefore be an explicit design target, as it does not emerge from self-improvement alone.'
