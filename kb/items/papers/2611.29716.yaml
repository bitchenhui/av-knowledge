summaries:
  one_liner_zh: 统一金融技能库通过工具发现与检查反馈让LLM智能体自我改进，有效程序生成率显著提升。
  abstract_zh: 论文提出Fin-RSI，一个为LLM智能体设计的统一Python库，整合市场分析、预测、投资组合构建与交易研究工具，并通过共享接口跨模型与智能体框架复用。智能体可从自然语言请求中发现合适工具、复用经过测试的实现，并通过检查与反馈机制改进生成的程序。在20个开放权重模型、6个交易持仓任务上评估，工具发现使产生有效程序的回合比例从9.7%提升到29.2%；对参数量≥140亿的模型，从23.6%提升到64.6%。该库与基准已作为共享资源开源发布。
