summaries:
  one_liner_zh: 发布IRTIQA多语言基准，评估三种自进化框架，发现自进化提升能力但几乎不缩小英-乌尔都语能力差距
  abstract_zh: 该工作构建IRTIQA基准，将DROP、SNIPS、AppWorld与SkillsBench对齐为英文、乌尔都语译文与乌尔都语语码混合三变体，采用矩阵语言语码混合流水线并经人工校验。作者用其评估三种自进化框架——Tool-R0（自博弈RL）、AgentEvolver（经验引导RL）与Autogenesis（协议级进化）——与未进化底座的差异。自进化普遍提升能力：AgentEvolver将AppWorld目标完成率从近零提升至20-36%，Autogenesis将SkillsBench通过率从16.48%提升至22.22%。但进化很少缩小语言差距：进化后系统在英语上仍领先最多0.26
    DROP F1，多步任务差距最大，语码混合表现为独立条件而非退化翻译；在共享Gemma-4 31B底座上差距进化前即存在，且RL式进化对乌尔都语推理的伤害可能大于英语，故语言平权须作为显式设计目标。
