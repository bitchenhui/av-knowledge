summaries:
  one_liner_zh: 单模型双旋钮（码率+真实感）极致图像压缩，SSM熵模型采用解码序对齐扫描与跨tap状态传递。
  abstract_zh: 基于预训练扩散先验的生成式编解码器可在低于0.05 bpp的超低码率下获得高感知质量，但多数方法需为每个码率单独训练模型，且无法控制合成细节量。PRISM 用单一模型提供两个连续控制旋钮：码率旋钮遍历率失真曲线，真实感旋钮调节合成细节水平。其视觉状态空间（VSS）上下文模型引入与解码顺序对齐（DOA）的扫描，使每个潜变量从汇总全部已解码上下文的状态进行预测，并通过跨tap状态传递避免每次解码从空状态重启。实验表明，PRISM
    优于变码率与固定码率编解码器，在相同 FID 下平均码率比最强基线低22%，同时取得更高 PSNR。
