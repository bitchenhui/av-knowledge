summaries:
  one_liner_zh: 基于 Outer Wilds 的基准，从知识、证据支撑与世界进度三视角度量 LLM 智能体跨回合自我改进。
  abstract_zh: 论文提出 AstronautBench，以游戏 Outer Wilds 的 22 分钟循环为具身环境：世界每回合重置、仅智能体知识延续、进度受知识门控，据此在三条同源轨迹上度量自我改进——对
    164 个世界知识问题的回答正确性、每个答案是否被其自引游玩帧与位置证据支持、以及到达地点与揭示传闻事实所反映的世界进度。每回合结束后由两个不同模型家族的 LLM 评委逐一核验答案。八回合基线实验（GPT-6.1
    Sol 与 Gemini 4 Argon 规划器，通过学习控制器或自身手柄输入操作）表明三个视角并不同步：GPT-6.1 Sol 正确答案率从 14.6% 升至 26.8%，但第 8 回合仅 59–68%
    的正确答案有引用证据支持，第 3 回合后不再揭示新的传闻事实，而其到达地点与记忆仍在增长。
