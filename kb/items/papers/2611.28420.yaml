summaries:
  one_liner_zh: 提出DiVE：五个8-12B小型开放权重模型经共享记忆、失败日志与最佳方案轮次集成，以多样性替代规模完成递归自改进。
  abstract_zh: 论文指出现有RSI（递归自改进）循环依赖前沿大模型且单次运行需数百次调用，而单独使用小型开放权重模型时程序易崩溃、改进易停滞。作者提出DiVE（diverse models
    evolve）集成方法，包含共享内存、失败日志和best-idea-wins轮次三个组件，使多个模型在同一上下文下撰写候选方案并逐轮保留最优思想。在22个MLE-bench Lite竞赛上，五个8-12B开放权重模型的集成测试误差比其平均成员低25.4%，比Llama
    3.3 70B低16.7%，与Qwen 3.5 122B-A10B相差仅7.1%而成本仅为其75%。结论是小型模型间的多样性可以部分替代RSI所依赖的模型规模。
