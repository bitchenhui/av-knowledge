summaries:
  one_liner_zh: 提出无标签测试时递归自我改进框架TT-RSI，上下文与权重双路迭代精炼，显著超越自一致性基线。
  abstract_zh: 论文提出TT-RSI，一个在无标签问题上于测试时改进LLM的递归自我改进框架，包含两个互相促进的组件：In-Context RSI以完整先前解为参考反复重解问题，让模型自行决定如何复用早期推理；In-Weight
    RSI将逐步精炼蒸馏进模型权重，理论上使首次尝试逼近无限步精炼极限。更新后的模型回答更准、精炼更有效，为后续训练生成更强参考信号。实验显示平均准确率较基座模型提升13.89%，在同等测试时算力预算下较最强自一致性方法高4.79%。
