summaries:
  one_liner_zh: 提出RecurSciBench基准，用可执行可验证的科学任务独立评估LLM智能体递归自我改进的跨任务与跨领域迁移收益。
  abstract_zh: 针对LLM智能体自动科研中递归自我改进（RSI）缺乏可执行、可验证评估的问题，作者提出可扩展基准RecurSciBench。其RecurSciPipe框架可从原始数据集自动构建科学建模与数据分析任务，并配备执行级验证与科学有效性检查。基准覆盖四个科学领域、多种数据模态与多样科学目标。实验对比四个RSI系统在源任务上进化前后的初始态与进化态在独立任务上的表现，覆盖同类型、跨类型与跨领域迁移。结果显示自我改进收益因智能体系统和科学领域而异，总体正收益可与个别任务退化共存，且经验可在源域无可测增益时仍迁移惠及其他领域。
