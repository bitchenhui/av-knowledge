summaries:
  one_liner_zh: 提出FinEvo自进化框架，用自博弈与可执行奖励提升LLM金融建模能力，为RSI在专业域提供实证。
  abstract_zh: 该论文提出FinEvo，一个将自主经验构建与金融能力提升相结合的自进化框架，全程仅依赖同一模型。FinEvo先准备金融模型，通过自博弈迭代演化挑战任务，再利用可执行奖励从交互中学习，并在Qwen3.6-27B上完成端到端执行。结果显示，解题反馈既支持推理需求不断提升，也能发现可执行检查遗漏的规范问题。经验学习使held-out同源任务的整任务成功率从22.73提升至29.09，在SpreadsheetBench
    2 Financial上从13.13提升至19.19。跨任务源与评估设置的一致提升、以及对训练中未出现任务类别的改进，表明FinEvo增强了跨任务共享的底层金融建模能力。
