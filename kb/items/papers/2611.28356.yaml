summaries:
  one_liner_zh: 提出跨会话记忆系统Engram，让LLM智能体调优异构神经网络时复用已验证经验，以少47%试验达到对照同等效果。
  abstract_zh: 论文提出Engram，一种将过往试验结果与背后假设及推理依据关联、并评估证据是否适用于当前模型的记忆系统，解决生产模型在架构、训练设置与推理预算上的异构性导致经验难以复用的问题。在线智能体在关键决策点注入证据：Initial
    Guidance在会话开始提供已验证经验，Session Retrieval在每批假设生成前检索相关历史会话，Trial Candidate Review将试验候选与匹配的过往试验比对；会话之间由离线智能体蒸馏已验证经验，使记忆具备自我改进能力。在两个广告（ads）模型上，Engram以少47%的试验次数达到无记忆对照32次试验的结果，且最终模型平均更优。
