summaries:
  one_liner_zh: 提出流式视频问答基准StreamRecall与免训练因果视觉记忆EviStream，在固定KV预算下保留推理关键证据。
  abstract_zh: 现有视频问答基准多为离线评测，难以反映真实流式场景中模型需在历史视频里检索并推理分散证据的需求。作者提出StreamRecall基准，包含462个视频上的4,983个问题，提供与查询时刻对齐的上下文及细粒度时间证据标注，要求模型检索、关联并推理时间上分散的证据。同时提出证据利用级联（Evidence
    Utilization Cascade），从证据定位、接地、链补全到答案推导逐级诊断模型推理能力。为支持高效长时流式推理，提出免训练的因果视觉记忆机制EviStream，在固定KV缓存预算下保留对推理关键的证据。实验显示当前视觉语言模型与真实流式需求之间存在显著差距。
