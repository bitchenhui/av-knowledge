summaries:
  one_liner_zh: VeilGS将暗光建模为空间变化增益加全局色调曲线的帷幕，实现无需成对监督的低光3DGS新视角重建。
  abstract_zh: 现有低光三维重建方法要么对整帧施加统一色调曲线，要么把暗光吸收进三维表示中。VeilGS将暗光退化建模为叠加在清晰场景上的帷幕：每个高斯以反照率与光照潜变量替代球谐函数，实现表面颜色与光照分离。每个视角由小网络预测粗基、按视角求解系数的空间变化增益加全局色调曲线进行暗化，去掉帷幕渲染即得恢复后的场景，无需成对正常光照监督也不存储逐视角参数。在Gaussian-DK上其恢复渲染的无参考NIQE与CLIP-IQA得分最优，并在55人盲测用户研究中评分最高；在LOM上达到与SOTA相当的结果。
