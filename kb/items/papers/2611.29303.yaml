summaries:
  one_liner_zh: 以因果时间线综述1997–2026年22篇LLM里程碑论文，终点落在RLHF对齐缺口与闭环递归自我改进。
  abstract_zh: 该综述以作者出生年1999为锚点，构建因果式、按时间排序的分类法，评估1997–2026年间22篇最具影响力的LLM论文。文章从RNN的长程遗忘问题讲起，梳理LSTM门控机制如何选择性保留长期记忆，Word2Vec如何将语言变为向量运算，以及Transformer的全对全注意力为何既开启现代LLM时代又引入二次方瓶颈。随后讨论Chinchilla揭示的参数与数据需同步扩展的规律，以及RLHF带来的表面化对齐如何演化为越狱攻击与单向拒绝子空间（J-space）。最后综合2024–2026年现状，涵盖递归模型坍塌、自主推理型越狱代理、机器速度代理入侵与闭环递归自我改进（AIDE^2）。
