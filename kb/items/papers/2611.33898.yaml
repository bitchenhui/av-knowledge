summaries:
  one_liner_zh: 提出MoS系统，在波动网络上自适应混合传输视频与文本模态，实现帕累托最优的低延迟视频LLM在线分析。
  abstract_zh: 针对云端视频大语言模型在线分析需持续上传视频、在恶劣动态网络下精度与响应性双双下降的问题，提出MoS流传输系统。其核心是利用视频LLM中视觉与派生文本模态的互补性与可替换性：设备端通过自适应锚帧选择与增量内容跟踪生成低延迟文本描述；联合性能剖析器刻画视频与文本配置对的精度与开销（含字幕输入分辨率与输出token预算）。基于随机优化的模态控制器结合两种模态的异步时延，按网络状况自适应选择模态组合与配置。在500条StreamingBench视频问答对、4G/5G上行轨迹及VideoLLM-Online与DisPider后端上，MoS相对被评估流式基线最多降低延迟违约94.3%、提升准确率60.4%。
