summaries:
  one_liner_zh: 提出MedicalRSI，通过Solver/Improver双角色的模型-框架协同进化，让医学LLM智能体实现递归自我改进并泛化到新工作流。
  abstract_zh: 医学LLM智能体部署后通常固定不变，同类错误会在不同患者间重复出现；现有自我改进方法只更新智能体权重或医学框架，而改进策略本身固定，限制了改进上限。MedicalRSI提出临床模型-框架协同进化：同一模型扮演两个角色，Solver是医学智能体本身，Improver是可学习的改进策略，依据Solver的失败撰写医学框架（harness）。每个框架以其相对无框架执行的增益作为奖励，两角色联合训练，使Improver持续适应Solver尚未解决的问题。在多个基准与多种LLM骨干上，MedicalRSI优于现有上下文级与权重级自我改进方法，并能迁移到未见临床工作流、新LLM与新数据库。
  deep_dive: docs/auto/2611.26806.md
