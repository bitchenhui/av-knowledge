summaries:
  one_liner_zh: 谷歌的进化式LLM编码智能体，迭代改写代码自动发现新算法，首次突破Strassen矩阵乘法纪录。
  abstract_zh: AlphaEvolve是一个进化式编码智能体，编排由LLM组成的自主流水线，通过直接修改代码并持续接收评估器反馈来迭代改进算法，从而产生新的科学与实践发现。应用于Google大规模计算栈时，它给出了更高效的数据中心调度算法、找到硬件加速器电路设计中功能等效的简化，并加速了支撑自身的底层LLM的训练。在数学与计算机科学的一系列问题上，它发现了可证明正确、超越现有最优解的新算法，显著扩展了先前自动化发现方法（Romera-Paredes等，2023）的适用范围。其中它找到的搜索过程能以48次标量乘法完成4×4复数矩阵相乘，是56年来Strassen算法在该设定下的首次改进。
  deep_dive: docs/auto/2506.13131.md
  research_brief:
    method: '输入为用户以 # EVOLVE-BLOCK-START/END 注释标记待进化代码块并提供返回标量指标字典的自动评估函数 ℎ（及可选背景知识）的初始程序，AlphaEvolve
      运行异步分布式进化循环——prompt 采样器从程序数据库（受 MAP elites 与岛屿模型启发）取样构建含历史解与评测反馈的富上下文提示，Gemini 2.0 Flash 与 Gemini
      2.0 Pro 组成的 LLM 集成生成 SEARCH/REPLACE diff 并应用到父程序生成子程序，评估器池通过评估级联、LLM 反馈与并行化执行打分后将优质解写回数据库——输出在 ℃
      指标上得分更高的改进程序 [p.3][p.4][p.7][p.8]。'
    findings:
    - 矩阵乘法张量分解任务（条件：从问题描述与标准梯度算法起步，多随机种子初始化并以评估级联评测，元素取整到最近整数或半整数以保证精确性）：AlphaEvolve 改进了 14 个矩阵乘法目标的 SOTA，其中对
      4×4 复值矩阵找到仅用 48 次标量乘法的算法，为 56 年来首次在特征 0 域上超越 Strassen 秩 49 的递归算法 [p.9][p.10]。
    - 对 2≤m,n≤5 的 54 个矩阵乘法目标（按对称性取排序尺寸 m≤n≤p）：38 个匹配已知最优秩、14 个超越、2 个落后（⟨4,4,9⟩ 得 108 对最优 104；⟨6,6,6⟩ 得
      156 对最优 153）；所有情形均给出使用整数或半整数表值的精确算法，其中 ⟨3,4,7⟩、⟨4,4,4⟩、⟨4,4,8⟩ 使用复值乘法 [p.34]。
    - 对 50 余个跨分析、组合、数论、几何等分支的数学构造问题（条件：初始起点为简单或随机构造）：约 75% 重新发现最优已知构造，约 20% 发现更优构造从而刷新 SOTA [p.3][p.10]。
    - 自相关不等式（条件：以等距阶梯函数构造）：600 区间阶梯函数将 C1 上界从 1.5098 改进至 1.5053，50 区间阶梯函数将 C2 下界从 0.88922 改进至 0.8962，400
      区间阶梯函数将 C3 上界从 1.45810 改进至 1.4557 [p.38]。
    - 不确定性不等式（条件：沿用 Hermite 多项式线性组合形式 P(x)=c0H0(x)+c1H4(x)+c2H8(x)，AlphaEvolve 找到细化常数 [c0,c1,c2]≈[0.32925,
      −0.01159, −8.9216×10⁻⁵]）：将 C4 上界从 0.3523 改进至 0.3521；纳入 Henry Cohn 指出的更精细方法后进一步改进至 0.3216 [p.39]。
    - Erdős 最小重叠问题（条件：构造 [0,2] 上取值 [0,1]、积分为 1 的阶梯函数）：新构造将上界从 0.380927 微幅改进至 C5 ≤ 0.380924 [p.13][p.40]。
    - 有限集和差问题（条件：构造含零的非负整数集 U 满足 |U−U| ≤ 2max(U)+1）：大小 2003 的集合 U1 将 C6 下界改进至 1.1479，大小 54265 的集合 U2 进一步改进至
      1.1584（此前下界 1.14465）[p.40][p.41]。
    - 11 维 kissing number（条件：找 593 个满足最大范数小于最小两两距离的 11 维非零整坐标点，配合 Lemma 1 证明其构成合法相切构型）：下界从 592 提升至 593
      [p.42][p.43]。
    - 几何装箱类问题（条件：直接搜索构造并对照 Erich's Packing Center 已知最优）：单位正六边形装箱 n=11、n=12 的外六边形边长分别从 3.943、4.0 改进至 3.931、3.942；最大/最小距离比问题在
      2 维 16 点达 ≈√12.889266112（原 √12.890）、3 维 14 点达 ≈√4.165849767（原 √4.168）[p.41][p.42]。
    - Heilbronn 问题（条件：在单位面积区域内放点最大化最小三角形面积）：三角形域 n=11 从 0.036 改进至 >0.0365；凸域 n=13 从 0.0306 改进至 0.0309、n=14
      从 0.0277 改进至 0.0278 [p.42]。
    - 圆装箱问题（条件：最大化不相交圆半径之和）：单位正方形 n=26、n=32 分别从 2.634、2.936 改进至 2.635、2.937；周长 4 的矩形 n=21 从 2.364 改进至
      2.3658 [p.43][p.44]。
    - Google 数据中心调度（条件：将在线调度表述为双变量向量装箱，从生产环境启发式进化，用基于历史负载数据的模拟器反馈，并在未见测试集上验证泛化后全量部署）：该启发式在全集群持续平均回收 0.7%
      的计算资源，且因可解释性、可调试性、可预测性与易部署性优于深度强化学习方案而被选用 [p.13][p.14]。
    - Gemini kernel 工程（条件：从 kernel 用户自动收集真实输入形状，一半作训练集一半作评估集，在真实 TPU 上以最小化实际运行时间为目标优化矩阵乘法 kernel 的 tiling
      启发式，仅改 tiling 策略故正确性由构造保证）：相对专家设计启发式平均 kernel 加速 23%，Gemini 总训练时间减少 1%，优化周期从数月工程投入降至数天自动化实验，并已部署于生产
      [p.15][p.16]。
    - TPU 算术电路 RTL 优化（条件：优化矩阵乘法单元中已高度优化的 Verilog 实现，目标为在保持功能正确（经稳健验证与设计者确认）下降低面积与功耗）：找到一个删除不必要位的简化改写，已集成进即将推出的
      TPU；该改进也被下游综合工具独立发现 [p.16]。
    - XLA 编译器生成 IR 优化（条件：针对大规模 GPU 推理的 FlashAttention kernel 及前后处理 IR，每步修改经随机输入对照验证数值正确性，最终版本经人工专家确认对所有输入正确）：kernel
      加速 32%，前后处理部分加速 15% [p.17]。
    - 消融实验（条件：在张量分解与 kissing number 下界两个任务上，三个不同随机种子、递增计算预算）：去除进化机制、提示上下文、meta prompt 进化、全文件进化或大模型（仅用单一小模型）中任一组件均导致性能显著下降，即各组件均有显著贡献
      [p.17][p.18]。
    limitation: 适用边界：AlphaEvolve 只适用于可设计自动评估器（机器可判定的评分函数 ℎ）的问题，需要人工实验的任务被排除在范围外；在自然科学等领域仅部分实验可仿真或自动化，且系统虽允许
      LLM 提供评估但并非其优化过的设定；此外，其单次评估可负担约 100 compute-hours，但若不并行化会拖慢进化迭代；张量分解设置在超过 ⟨5,5,5⟩ 的规模上于单 GPU 加速器、1000
      个随机种子下评测常内存溢出，扩展到更大矩阵需进一步优化（54 个目标中 2 个未达已知最优）；对自身基础设施与基座 LLM 的改进收益目前尚属中等、反馈回路以月计 [p.2][p.7][p.8][p.21][p.34]。
