summaries:
  one_liner_zh: 首个在任务间隙无需训练/梯度即改写自身权重的具身智能体，实现稳定多轮递归自我改进
  abstract_zh: 该工作提出自我升级具身智能体：白天一个27B语言模型智能体在家庭环境中执行任务，夜间读取自身运行记录，发现大量步骤浪费于触达token上限的回复，将该习惯追溯到隐状态中的一个方向，并改写权重中的一个张量。整个升级过程无训练、无梯度、无奖励模型、无第二个模型、无测试时扩展、无提示工程。为保证不破坏自身，智能体以未改动的自身为对照，在练习任务上测试每个修改，仅保留通过验证的编辑。在数千个held-out回合、每任务48个新种子的评估中，单次保留编辑即使其完成更多任务、步数与token消耗更少；多轮升级稳定持续无崩溃，且四个规模的模型家族中仅27B具备此能力。
