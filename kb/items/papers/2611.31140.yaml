summaries:
  one_liner_zh: 服务端令牌压缩+客户端超网络恢复的3DGS人体体积视频实时流式框架，轻量GPU上22.1ms解码。
  abstract_zh: HoloSplat是面向以人为中心的体积视频实时流式传输框架，将前馈重建器在高斯头之前切开，构建由服务端令牌压缩与客户端令牌恢复组成的多码率流式编解码器。服务端采用不透明度引导的令牌剪枝、PCA降维与令牌锚点无损几何编码进行压缩；客户端将特征重建超网络融合进高斯头以恢复压缩损失。提出神经会话校准（NSC），在预热阶段利用新到的相机视角在线微调高斯头，以零逐帧开销解决新相机参数与采集条件差异导致的质量退化。系统在四块RTX
    5090上以50 Mbit/s平均达32.2 FPS，在RTX 3050 Ti笔记本GPU上22.1 ms解码每帧3D高斯，传输数据较未压缩float32高斯减少22.8倍，校准解码使PSNR提升1.050
    dB。
