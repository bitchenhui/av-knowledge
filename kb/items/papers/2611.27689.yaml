summaries:
  one_liner_zh: Actor-Reflector双智能体框架，在不更新模型参数的前提下递归自改进机器人操作的执行harness。
  abstract_zh: 该文提出Embodied-Harness，一个面向机器人操作的双智能体框架，通过精炼执行harness而非更新模型参数实现自改进。Actor经机器人控制接口与环境交互，Reflector将执行证据转化为可复用的操作指导；分层记忆架构同时维护短期执行上下文与长期经验知识。基于证据的经验反思将失败诊断锚定于真实交互观测，递归harness自改进在多次尝试间持续精炼操作指导。方法在RoboTwin
    2.0、RoboSPA、RMBench上分别取得82.4%、76.7%、94.4%的成功率，真实世界三个任务平均成功率达96.7%，并在环境变化泛化、空间推理、长时程规划与记忆依赖操作上展现优势。
