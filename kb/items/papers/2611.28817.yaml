summaries:
  one_liner_zh: 提出联合码率、HDRVMAF 感知质量与客户端能耗的凸包框架，为 HDR 流媒体构建码率阶梯。
  abstract_zh: 针对 HDR 视频解码复杂度与能耗显著高于 SDR、而现有码率阶梯仍以 VMAF 等 SDR 指标优化的问题，该文提出联合码率、HDR 感知质量（HDRVMAF）与客户端处理能耗（含解码与上采样）的码率-质量-能耗凸包优化框架。实验在
    LIVE HDR 视频质量评估数据库的 12 段 4K HDR 序列上进行，每段评估 72 个表示。结果表明，传统 VMAF 优化的阶梯频繁选出一旦计入能耗即被支配的高分辨率编码；相比默认 HLS
    阶梯，所提方法在等 HDRVMAF 下最多节省 54.34% 码率，并在较高能耗权重下实现最高 43.10% 的客户端能耗降低。该框架可作为显式暴露并控制感知质量-能耗权衡的 HDR 码率阶梯构建基础。
