summaries:
  one_liner_zh: 基于冻结MLLM与几何执行批评器的VLN智能体框架，配合离线自改进，R2R-CE/RxR-CE上SR达84%/86%。
  abstract_zh: 提出 Navigent，一个围绕冻结多模态大语言模型（MLLM）构建的智能体视觉语言导航（VLN）框架，核心组件为几何锚定执行批评器（GEC）。GEC 执行两类一致性检查：动作-运动一致性（核对实测位移与指令动作）以及运动-地标一致性（在世界坐标中跟踪智能体选择的视觉锚点与入口候选）；一旦检测到偏差即中断剩余动作序列，触发重观测、局部调整或基于节点的恢复，历史视觉记忆支持长程路线的进度跟踪。框架还包含离线自改进流程，通过分析成功与失败训练轨迹精炼导航提示词与
    GEC 逻辑，且模型权重保持不变。在 R2R-CE validation-unseen（1,839 episodes）与 RxR-CE validation-unseen（3,669 episodes）上分别取得
    84.0%/86.0% 成功率（SR）与 72.9%/69.1% SPL。
assessment:
