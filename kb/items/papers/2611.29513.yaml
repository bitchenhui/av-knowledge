  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 让LLM在Python会话中编写程序构造低秩权重编辑，无需梯度即可递归自我改进。
  abstract_zh: 提出SELFWRITE框架：当前模型在新训练题上研究自身推理，在持久化Python会话中检查自身权重与激活，并编写程序用白盒原语（奇异方向、对错答案的激活对比、秩一投影等）构造低秩权重编辑，全程不使用训练或梯度工具。每个候选编辑在隐藏门控集上对照当前模型评估一次，仅合并严格改进的最优编辑，编辑后的模型继续编写下一代编辑。在Qwen3.8-27B与DAPO-Math数学题上，五代SELFWRITE将门控集准确率从73.95%提升至76.45%，在循环从未见过的held-out测试划分上avg@4从76.30%升至77.75%、pass@4从82.60%升至84.80%，且未执行任何梯度步骤。
