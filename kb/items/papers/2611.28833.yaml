summaries:
  one_liner_zh: 让 Qwen3.5-0.8B 读取并编辑自身权重实现自我改进，数学推理大幅提升，但增益缺乏可解释性。
  abstract_zh: 论文将权重空间编程（WSP）从改进小模型扩展到语言模型自身，提出 Self-WSP：Qwen3.5-0.8B 读取自身权重、提出编辑并以编辑后的权重继续担任解题者与编辑者。实验观察到真实的自我改进：GSM8K
    准确率可从 11.8% 提升至 62.2%，MATH500 从 7.0% 提升至 32.2%，有时仅改动 16 个参数，且部分情形下反复自我编辑可持续提升。然而分析显示这些增益缺乏可解释性：模型对所做编辑理解甚少，随机搜索驱动的
    WSP 有时表现相当。作者认为 Self-WSP 为递归自我改进（RSI）提供了可行路径，但兑现该前景仍需进一步探索。
