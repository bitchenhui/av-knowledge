summaries:
  one_liner_zh: 端到端神经音频编解码器：单模型3–18kbps可变码率，3kbps质量胜Opus 12kbps、接近EVS 9.6kbps。
  abstract_zh: SoundStream由全卷积编解码网络与残差向量量化器构成，端到端联合训练，结合对抗与重建损失实现高质量音频重建。通过量化器层的结构化dropout，单一模型可在3kbps至18kbps范围内运行可变码率，且与固定码率模型相比质量损失可忽略。模型支持流式推理与低延迟实现，可在智能手机CPU上实时运行。在24kHz采样率音频的主观评测中，SoundStream
    3kbps质量优于Opus 12kbps，接近EVS 9.6kbps。此外无需额外时延即可在编码端或解码端联合执行压缩与增强，文中以语音背景噪声抑制进行演示。
  deep_dive: docs/auto/2107.03312.md
  research_brief:
    method: 输入为 24 kHz 采样的单声道时域波形 x ∈ R^T [p.1][p.3]，由全卷积编码器（如 strides (2,4,5,8)，M=320，即每 320 个样本输出一个
      75 Hz 嵌入）映射为嵌入序列 enc(x) ∈ R^{S×D}，经残差向量量化器（RVQ，级联 Nq 个 codebook 大小为 N 的 VQ，训练时以 quantizer dropout
      对每个样本均匀采样 nq ∈ [1, Nq]）量化，再由镜像结构的全卷积解码器重建波形 x̂ ∈ R^T [p.3][p.4][p.5]；编码器、量化器、解码器与波形/STFT 判别器以对抗损失
      + 判别器特征损失 + 多尺度谱重建损失（λadv=1, λfeat=100, λrec=1）端到端联合训练，并可在瓶颈处通过 FiLM 条件层在编码端或解码端选择性地联合执行背景噪声抑制 [p.1][p.5][p.6]。
    findings:
    - 主观评测（MUSHRA 风格众包、24 kHz 音频、200 条 2–4 s 样本、每条 20 次评分）下，SoundStream@3 kbps 显著优于 Opus@6 kbps 与 EVS@5.9
      kbps（后两者为其各自最低码率），也优于 Lyra@3 kbps；EVS 需至少 9.6 kbps、Opus 需至少 12 kbps 才能匹配其质量，即需 3.2×–4× 的比特 [p.7]
    - 中码率（6 kbps 档）与高码率（12 kbps 档）对比中，EVS 与 Opus 分别需 2.2×–2.6× 与 1.3×–1.6× 更多比特才能达到与 SoundStream 相同的 MUSHRA
      质量 [p.7]
    - 按内容类型的主观评测：SoundStream 对 clean speech 与 noisy speech 的质量保持一致；以低至 3 kbps 编码音乐时，质量显著优于 Opus@12 kbps
      与 EVS@5.9 kbps [p.7]
    - ViSQOL 客观测评（3–18 kbps、恒定码率）：质量随码率下降平稳降低，3 kbps 时仍高于 3.7；按量化符号经验熵（假设各 VQ 层为离散无记忆源、无时间冗余）估计的码率下界显示熵编码潜在可节省
      7%–20% 比特 [p.7]
    - 比特率可扩展性（ViSQOL，3–18 kbps）：以 quantizer dropout 训练的单一模型消除了与 bitrate-specific 模型的质量差距，在 9 与 12 kbps
      甚至略优（提示 dropout 兼具正则化作用）；MUSHRA 中 6/12 kbps 与专用模型持平，3 kbps 仅略差 [p.8]
    - 消融（6 kbps）：将可学习编码器替换为固定 mel-filterbank（类似 Lyra）使 ViSQOL 从 3.96 降至 3.33，甚至低于带学习编码器的 3 kbps 模型（ViSQOL
      3.76），说明学习编码器显著改善率–失真权衡 [p.8]
    - 编码/解码器容量权衡（6 kbps，Pixel4 智能手机单 CPU 线程实测 RTF）：默认 Cenc=Cdec=32（8.4 M 参数）ViSQOL 4.01±0.03、编码/解码 RTF
      2.4×/2.3×；Cenc=8/Cdec=32 时 ViSQOL 3.99±0.03 且编码 RTF 升至 18.6×，而 Cdec=8 时 ViSQOL 降至 3.90±0.03，支持“轻编码器
      + 重解码器”的非对称配置 [p.9]
    - RVQ 深度与 codebook 大小权衡（同为 6 kbps）：Nq=8/N=1024、Nq=16/N=32、Nq=80/N=2 分别取得 ViSQOL 4.01±0.03、3.98±0.03、3.92±0.03，表明可成功训练很深的
      RVQ（80 个 1-bit 量化器）且仅轻微降质 [p.9]
    - 架构延迟（6 kbps）：strides (1,4,5,8)、(2,4,5,8)、(4,4,5,8) 分别对应 7.5、13、26 ms 延迟，三者 ViSQOL 均约 4.01（质量等价），但增大延迟会显著提升实时因子（编码
      RTF 由 1.6× 增至 4.1×）[p.9]
    - 联合压缩与降噪（1000 条 noisy speech 测试样本，以 clean speech 为参考计算 ViSQOL）：开启降噪后质量显著提升；条件化加在编码端或解码端无显著差异；可推理时灵活开关降噪的模型相对始终降噪的固定模型无性能损失
      [p.10]
    - 熵编码潜力（以 3200 条训练样本的经验分布与 1000 条测试样本的交叉熵估计比特率下界）：编码端降噪与固定降噪相比解码端降噪能带来更大的潜在比特节省，即量化前去噪使表示更可压缩 [p.10]
    - 联合 vs 级联（VCTK 数据集、输入 SNR 为 0/5/10/15 dB、每档 1000 条 2 s 样本）：单一联合模型（压缩+降噪）的 ViSQOL 与“SoundStream 压缩
      + SEANet 降噪”两模型级联几乎持平（如 0 dB 时 2.93±0.02 vs 3.02±0.03/3.05±0.02），且计算成本约减半、无额外架构延迟；输入 SNR 越高，性能差距越小
      [p.10][p.11]
    limitation: 适用边界：实验仅在 24 kHz 采样率与 3–18 kbps 低到中码率范围内验证，模型按恒定码率运行，7%–20% 的熵编码节省为假设量化符号无层间与时间冗余的下界估计、并未实际实现
      [p.3][p.7]；训练与评测数据限于 clean speech（LibriTTS）、合成 noisy speech（LibriTTS+Freesound，噪声增益 [−30 dB, 0 dB]）、音乐（MagnaTagATune）及真实近场/远场带噪混响语音，其中音乐因内容多样性更具挑战、clean
      speech 质量最高 [p.6][p.7]；联合压缩与增强仅以背景噪声抑制为例演示，增强性质由训练数据决定 [p.1][p.6]；主观评测采用无低通锚点的 MUSHRA 变体，模型选型与消融依赖
      ViSQOL 客观指标 [p.7]；架构延迟由编码器 striding 因子决定（默认 M=320，约 13.3 ms/帧）[p.9]。
