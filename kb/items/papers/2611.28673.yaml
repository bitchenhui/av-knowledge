summaries:
  one_liner_zh: 免训练多视角证据选择管线，仅用2D图像与推理工具完成3D场景理解，3D VQA提升约10%。
  abstract_zh: 论文提出一种免训练、按查询条件驱动的多视角推理管线，不构建显式3D表示，仅依赖多张2D RGB图像和纯推理工具。方法先将查询分解为若干概念属性，再执行由粗到细的证据选择：粗检索对所有视角评分，多样性感知选择器去冗余，重排序阶段按目标可见性或可回答性筛选视角，并可选地进行证据定位与自验证以精修开放性答案的最终响应。整个流程不进行任何任务特定训练、推理时不用点云/体素/场景图等3D表示。结果显示在3D
    VQA上取得约10%增益，在稠密描述与Embodied QA上取得约5%增益。作者还提出基于评判者的评估系统，允许语义正确或部分正确的多样答案，以更全面地评估场景理解。
